name: NexusOps Python Tests

on:
  push:
    branches:
      - refactor/integration-foundation
    paths:
      - "**.py"
      - "workflows/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches:
      - refactor/integration-foundation
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      ELASTICSEARCH_PASSWORD: ci-placeholder
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application modules
        run: |
          python -m compileall -q llm_query_planner.py query_planner.py tools server.py
      - name: Run automated tests
        run: python -m pytest -q tests
